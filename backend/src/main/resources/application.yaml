spring:
  application:
    name: gpucodeforces-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gpucodeforces}
    username: ${DATABASE_USER:gpucodeforces}
    password: ${DATABASE_PASSWORD:gpucodeforces}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # The history table lives in public. Without this, Flyway takes the current schema from search_path
    # ("$user", public): once V1 has created the gpucodeforces schema for the gpucodeforces user, a restart
    # looks there, finds tables but no history and refuses to start.
    default-schema: public
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

platform:
  judge:
    gateway-url: ${JUDGE_GATEWAY_URL:http://localhost:8090}
    execution-mode: ${JUDGE_MODE:gpu}
  admin:
    # Comma-separated handles of administrators (Groovy console, problem import).
    handles: ${ADMIN_HANDLES:}
  processors:
    # Processors of the judge offered on this platform (judge-api Processors), comma-separated.
    enabled: ${PROCESSORS:gpu-cuda}
    # What a person is shown as the processor's model; the others show the processor's title. The emulators' versions
    # are pinned in the judge's images (judge/README.md), so their models are fixed here.
    models:
      gpu-cuda: ${GPU_NAME:NVIDIA GeForce RTX 3060}
      rtl: Yosys 0.70 + Verilator 5.053
      riscv-rvv: QEMU 11.1.3, RV64GCV, VLEN 256
      cuda-sim: GPGPU-Sim, NVIDIA Tesla V100 (QV100)
      coral-npu: Renode 1.17.0, RV32IMF + Zve32x, VLEN 128
  problems:
    # Problem repository checkout (docs/backend/problem-package.md). Empty: the bank stays empty.
    directory: ${PROBLEMS_DIRECTORY:}
    # Keep the directory as a clone of this repository (lottery7/GpuCodeforcesProblems in compose.yaml).
    git-url: ${PROBLEMS_GIT_URL:}
    git-branch: ${PROBLEMS_GIT_BRANCH:master}
    # Sub-directory with one directory per problem package.
    path: ${PROBLEMS_PATH:}
    sync-interval: ${PROBLEMS_SYNC_INTERVAL:PT1M}

logging:
  pattern:
    # Every line carries the submission and the user it concerns (see SubmissionService, RequestLogFilter).
    level: "%5p [sub=%X{submission:-} user=%X{user:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
