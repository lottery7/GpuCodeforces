spring:
  application:
    name: gpucodeforces-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/gpucodeforces}
    username: ${DATABASE_USER:gpucodeforces}
    password: ${DATABASE_PASSWORD:gpucodeforces}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # The history table lives in public. Without this, Flyway takes the current schema from search_path
    # ("$user", public): once V1 has created the gpucodeforces schema for the gpucodeforces user, a restart
    # looks there, finds tables but no history and refuses to start.
    default-schema: public
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

platform:
  judge:
    gateway-url: ${JUDGE_GATEWAY_URL:http://localhost:8090}
  admin:
    # Comma-separated handles of administrators (Groovy console, problem import).
    handles: ${ADMIN_HANDLES:}
  gpu:
    profile: ${GPU_PROFILE:rtx3060}
    name: ${GPU_NAME:NVIDIA GeForce RTX 3060}
  problems:
    # Problem packages, one directory each (docs/backend/problem-package.md). Empty: the bank stays empty.
    directory: ${PROBLEMS_DIRECTORY:}
    # Optional: keep the directory as a clone of this repository.
    git-url: ${PROBLEMS_GIT_URL:}
    git-branch: ${PROBLEMS_GIT_BRANCH:master}
    sync-interval: ${PROBLEMS_SYNC_INTERVAL:PT1M}

logging:
  pattern:
    # Every line carries the submission and the user it concerns (see SubmissionService, RequestLogFilter).
    level: "%5p [sub=%X{submission:-} user=%X{user:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info
