server:
  port: ${PORT:8080}

spring:
  application:
    name: gpu-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gpuproblems}
    username: ${DB_USERNAME:gpu}
    password: ${DB_PASSWORD:gpu}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.example.gpuplatform.sync: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  problems:
    git:
      repository-url: ${PROBLEMS_GIT_URL:}
      branch: ${PROBLEMS_GIT_BRANCH:main}
      local-directory: ${PROBLEMS_GIT_DIRECTORY:./data/problems-repo}
      problems-directory: ${PROBLEMS_DIRECTORY:problems}
      sync-on-startup: ${PROBLEMS_SYNC_ON_STARTUP:false}
    internal-api-key: ${INTERNAL_API_KEY:}
    github-webhook-secret: ${GITHUB_WEBHOOK_SECRET:}