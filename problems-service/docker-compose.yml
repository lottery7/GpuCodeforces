services:
  postgres:
    image: postgres:16-alpine
    container_name: gpuproblems-postgres
    environment:
      POSTGRES_DB: gpuproblems
      POSTGRES_USER: gpu
      POSTGRES_PASSWORD: gpu
    ports:
      - "5432:5432"
    volumes:
      - gpuproblems-data:/var/lib/postgresql/data
    networks:
      - gpuproblems-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpu -d gpuproblems"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpuproblems-service
    image: gpu-platform:0.1.0
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gpuproblems
      DB_USERNAME: gpu
      DB_PASSWORD: gpu
      # Point the service at its own clone directory (mounted below).
      PROBLEMS_GIT_DIRECTORY: /data/problems-repo
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    volumes:
      - gpuproblems-repo:/data
    networks:
      - gpuproblems-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  gpuproblems-net:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  gpuproblems-data:
  gpuproblems-repo: