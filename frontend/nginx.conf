server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The backend's address is looked up through Docker's DNS on requests, not once at start: a recreated backend
    # container gets another address, and nginx would answer 502 until it is restarted itself.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Administrator page served by the backend (docs/backend/submissions.md).
    location /admin {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
