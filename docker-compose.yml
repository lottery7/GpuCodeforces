# GPU Codeforces — shared compose file for the whole project.
#
#   docker compose up -d                   # RabbitMQ + judge gateway (any machine)
#   docker compose --profile gpu up -d     # + judge executor (machine with an NVIDIA GPU and nvidia-container-toolkit)
#
# Other parts of the platform (backend, frontend, DB) are added here as services by their owners.
name: gpu-codeforces

services:
  rabbitmq:
    image: rabbitmq:4.1.8-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" # management UI, guest/guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20

  judge-gateway:
    build:
      context: ./judge
      dockerfile: deploy/gateway.Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      JUDGE_GPU_PROFILES: rtx3060
      JUDGE_DEFAULT_GPU_PROFILE: rtx3060
      SPRING_PROFILES_ACTIVE: ${JUDGE_LOG_PROFILE:-default}
    ports:
      - "8080:8080" # API + /swagger-ui.html
    depends_on:
      rabbitmq:
        condition: service_healthy

  judge-executor:
    profiles: ["gpu"]
    build:
      context: ./judge
      dockerfile: deploy/executor.Dockerfile
    # nsjail needs to create namespaces/mounts; clock locking needs root on the GPU
    privileged: true
    environment:
      RABBITMQ_HOST: rabbitmq
      JUDGE_GPU_PROFILE: rtx3060
      JUDGE_EXECUTOR_ID: ${JUDGE_EXECUTOR_ID:-gpu-node-1}
      JUDGE_LOCK_CLOCKS: ${JUDGE_LOCK_CLOCKS:-}
      SPRING_PROFILES_ACTIVE: ${JUDGE_LOG_PROFILE:-default}
    shm_size: 8gb # run directories (solution outputs) live in /dev/shm
    volumes:
      - judge-data:/var/lib/judge # compiled objects + generated tests survive restarts
    ports:
      - "8081:8081" # actuator: /actuator/health, /actuator/prometheus
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility]
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  rabbitmq-data:
  judge-data:
