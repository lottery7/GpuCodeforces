name: Backend

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Unit tests and the integration tests, which start PostgreSQL and RabbitMQ through Testcontainers
  # (the runner has Docker).
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - run: ./gradlew --no-daemon :backend:test :backend:integrationTest
