name: Judge

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  # Unit tests of the judge without a GPU, CUDA or nsjail: the executor tests drive fake Python solutions and
  # generators instead (they need python3, which the runner has).
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle
      - run: ./gradlew --no-daemon :judge-api:test :judge-gateway:test :judge-executor:test
      - run: python3 -m unittest discover -s tests -v
        working-directory: judge/pytools
