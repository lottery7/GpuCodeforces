openapi: 3.0.3
info:
  title: GPU Codeforces Judge Gateway API
  version: 1.0.0
  description: |
    Точка входа системы проверки. Бэкенд отправляет сюда посылки, а прогресс и вердикты получает
    асинхронно из очереди RabbitMQ `judge.events` (сообщения `JudgeEvent` в JSON, см. judge/README.md).
    Все тела запросов и ответов - application/json, время в UTC (ISO 8601).
    Тело больше лимита (8 МБ по умолчанию) отклоняется с 413 до разбора, запрос с телом без
    Content-Length - с 411.
    Схемы, совпадающие с сообщениями брокера (`ProblemSpec`, `SubmissionRequest` и вложенные), заданы
    классами модуля judge-api; генератор использует их вместо своих моделей.
servers:
  - url: /api/v1
tags:
  - name: Submissions
  - name: Problems
  - name: Monitoring
paths:
  /submissions:
    post:
      tags: [Submissions]
      operationId: submit
      summary: Поставить посылку в очередь на проверку
      description: |
        Валидирует запрос и сохраняет задание в брокере (publisher confirm), сразу отвечает 202.
        Повтор того же submissionId в окне дедупликации возвращает 200 с duplicate=true и jobId
        первого запроса; 409, пока первый запрос ещё ждёт подтверждения брокера.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmissionRequest'}
      responses:
        '202':
          description: Принято, задание в очереди
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionAccepted'}
        '200':
          description: Повтор уже принятого submissionId; задание не ставится повторно
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: Этот же submissionId прямо сейчас принимается другим запросом, повторите позже
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '411': {$ref: '#/components/responses/LengthRequired'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '503': {$ref: '#/components/responses/BrokerUnavailable'}
  /submissions/{submissionId}:
    delete:
      tags: [Submissions]
      operationId: cancel
      summary: Отменить посылку в очереди или в работе (без гарантий)
      description: |
        Если executor успел поймать отмену, следом придёт FINISHED с вердиктом CANCELLED.
        Сообщение об отмене не сохраняется, поэтому 202 не означает, что отмена сработает.
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '202': {description: Отмена разослана executors}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/BrokerUnavailable'}
  /problems/validate:
    post:
      tags: [Problems]
      operationId: validateProblem
      summary: Структурно проверить задачу (тесты не генерируются)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProblemSpec'}
      responses:
        '200':
          description: Результат проверки; ошибки задачи - не ошибка запроса
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '411': {$ref: '#/components/responses/LengthRequired'}
        '413': {$ref: '#/components/responses/TooLarge'}
  /executors:
    get:
      tags: [Monitoring]
      operationId: listExecutors
      summary: Executors и их последний heartbeat
      responses:
        '200':
          description: Executors по executorId
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ExecutorView'}
  /processors:
    get:
      tags: [Monitoring]
      operationId: listProcessors
      summary: Каталог процессоров и их доступность
      description: |
        Весь каталог процессоров (judge-api Processors) и по каждому - принимает ли gateway на него посылки
        и есть ли живой executor, который может его судить. Для мониторинга; бэкенд от него не зависит.
      responses:
        '200':
          description: Процессоры в порядке каталога
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ProcessorView'}
  /queues:
    get:
      tags: [Monitoring]
      operationId: listQueues
      summary: Ожидающие задания и доступная мощность по процессорам
      responses:
        '200':
          description: Принимаемые процессоры и процессоры, о которых сообщают executors
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/QueueView'}
components:
  responses:
    BadRequest:
      description: |
        Невалидный запрос: error=validation_failed (details - найденные ошибки)
        или malformed_request (тело не разбирается, details называет поле)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    LengthRequired:
      description: Нет Content-Length (error=length_required)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TooLarge:
      description: Тело больше лимита (error=request_too_large)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    BrokerUnavailable:
      description: Брокер недоступен (error=broker_unavailable), запрос можно повторить
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Id:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,128}$'
      description: Id посылки или задачи; попадает в имена файлов, сообщения и логи
    SubmissionRequest:
      type: object
      required: [submissionId, problem, source, processor, language]
      properties:
        submissionId:
          allOf: [{$ref: '#/components/schemas/Id'}]
          description: Генерирует бэкенд; ключ идемпотентности
        problem: {$ref: '#/components/schemas/ProblemSpec'}
        source: {type: string, description: 'Файл участника на языке language, до 128 КБ'}
        processor:
          type: string
          pattern: '^[a-z0-9_-]+$'
          description: Процессор из каталога (GET /processors), например gpu-cuda; задача должна его объявлять
        language:
          type: string
          description: Один из языков, которые задача разрешает на этом процессоре, например cuda
    SubmissionAccepted:
      type: object
      required: [submissionId, processor, language, status, queuedAt, duplicate, jobId]
      properties:
        submissionId: {type: string}
        processor: {type: string}
        language: {type: string}
        status: {$ref: '#/components/schemas/SubmissionStatus'}
        queuedAt: {type: string, format: date-time}
        duplicate: {type: boolean, description: 'Этот submissionId уже был принят недавно и повторно не поставлен'}
        jobId: {type: string, description: 'Id задания; его же несут события JudgeEvent.jobId'}
    SubmissionStatus:
      type: string
      enum: [QUEUED, COMPILING, PREPARING, TESTING, FINISHED]
    ProblemSpec:
      type: object
      description: |
        Всё, что нужно judge о задаче; приходит целиком с каждой посылкой. Тестов в ней нет:
        их объявляет генератор (см. judge/docs/problem-format.md).
      required: [id, signature, generator]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version:
          type: string
          maxLength: 128
          default: '1'
          description: Версия на стороне бэкенда, только для логов; кэш ключуется хэшем содержимого
        signature: {$ref: '#/components/schemas/Signature'}
        generator: {$ref: '#/components/schemas/GeneratorSpec'}
        checker: {$ref: '#/components/schemas/CheckerSpec'}
        limits: {$ref: '#/components/schemas/LimitsSpec'}
        timing: {$ref: '#/components/schemas/TimingSpec'}
        compile: {$ref: '#/components/schemas/CompileSpec'}
        policy: {$ref: '#/components/schemas/PolicyOverrides'}
        allowCustomTests:
          type: boolean
          default: false
          description: Генератор определяет validate_input(test, inputs), и задаче можно передавать customTests
        customOnly:
          type: boolean
          default: false
          description: Запускается только единственный тест из customTests, без тестов генератора
        customTests:
          type: array
          maxItems: 32
          description: Тесты, заданные данными; идут после тестов генератора на любом процессоре задачи, без замера score
          items:
            type: object
            required: [scalars, inputs]
            properties:
              scalars: {type: object, additionalProperties: {type: number}}
              inputs: {type: object, additionalProperties: {type: array, items: {type: number}}}
        processors:
          type: array
          items: {$ref: '#/components/schemas/ProcessorSpec'}
          description: |
            Процессоры, на которых можно сдавать задачу. Пусто - только gpu-cuda с языком cuda и лимитом
            limits.timeLimitMs (так работают пакеты, написанные до процессоров). timing, compile, policy и
            limits.gpuMemoryLimitMb относятся к gpu-cuda; флаги compile действуют и для cuda-sim.
    ProcessorSpec:
      type: object
      required: [id, languages]
      properties:
        id: {type: string, description: 'Процессор из каталога, например rtl'}
        languages:
          type: array
          items: {type: string}
          description: Подмножество языков процессора, на которых можно сдавать
        limit:
          type: number
          format: double
          description: |
            Лимит score одного замерного теста в единицах типа score процессора. Обязателен у всех, кроме
            gpu-cuda; у gpu-cuda без него действует limits.timeLimitMs
        rtl: {$ref: '#/components/schemas/RtlSettings'}
    RtlSettings:
      type: object
      description: Только для процессора rtl, см. judge/docs/problem-format.md
      properties:
        readPorts: {type: integer, format: int32, default: 1, description: 'Портов чтения у каждого читаемого массива, 1..8'}
        dataMode:
          allOf: [{$ref: '#/components/schemas/RtlDataMode'}]
          default: MEMORY
    RtlDataMode:
      type: string
      description: |
        MEMORY - каждый массив - память судьи со своими портами; STREAM - судья подаёт входы и принимает
        выходы по одному элементу за такт
      enum: [MEMORY, STREAM]
    Signature:
      type: object
      description: Сигнатура функции, которую реализует участник
      required: [params]
      properties:
        function: {type: string, default: solve}
        params:
          type: array
          items: {$ref: '#/components/schemas/ParamSpec'}
    ParamSpec:
      type: object
      required: [name, type, role]
      properties:
        name: {type: string, description: 'Идентификатор C; ключ в словарях генератора и эталона'}
        type: {$ref: '#/components/schemas/DType'}
        role: {$ref: '#/components/schemas/ParamRole'}
        memory:
          allOf: [{$ref: '#/components/schemas/MemorySpace'}]
          description: |
            Где harness размещает массив перед вызовом solve; обязательно для массивов. Имеет смысл только
            для gpu-cuda и cuda-sim, остальные процессоры его не учитывают
        size:
          type: string
          description: 'Число элементов массива - целое выражение над скалярами, например M*K'
    ParamRole:
      type: string
      description: |
        INPUT - const T*, только чтение; OUTPUT - T*, сравнивается с эталоном;
        INOUT - T*, заполнен данными и сравнивается после изменения; SCALAR - передаётся по значению
      enum: [INPUT, OUTPUT, INOUT, SCALAR]
    MemorySpace:
      type: string
      enum: [DEVICE, HOST]
    DType:
      type: string
      description: Скаляры допускают только FLOAT32, FLOAT64, INT32, UINT32, INT64, UINT64
      enum: [FLOAT16, BFLOAT16, FLOAT32, FLOAT64, INT8, UINT8, INT16, INT32, UINT32, INT64, UINT64]
    GeneratorSpec:
      type: object
      required: [source]
      properties:
        language:
          allOf: [{$ref: '#/components/schemas/GeneratorLanguage'}]
          default: PYTHON
        source:
          type: string
          description: 'Python-модуль с tests(), generate(...) и reference(...), до 256 КБ'
    GeneratorLanguage:
      type: string
      enum: [PYTHON]
    CheckerSpec:
      type: object
      properties:
        mode:
          allOf: [{$ref: '#/components/schemas/CheckerMode'}]
          default: TOLERANCE
        rtol: {type: number, format: double, default: 0.00001}
        atol: {type: number, format: double, default: 0.000001}
    CheckerMode:
      type: string
      description: |
        TOLERANCE - для float |out - exp| <= atol + rtol * |exp|, NaN совпадает только с NaN,
        Inf - точно; целые сравниваются точно. EXACT - побитовое равенство
      enum: [TOLERANCE, EXACT]
    LimitsSpec:
      type: object
      properties:
        timeLimitMs:
          type: integer
          format: int64
          default: 1000
          description: |
            Лимит измеренного времени одного вызова solve на gpu-cuda (см. TimingSpec.mode), до 30000;
            заменяется лимитом ProcessorSpec процессора gpu-cuda, если он задан
        wallTimeLimitMs:
          type: integer
          format: int64
          description: Защитный лимит реального времени вызова; по умолчанию max(3 * TL, TL + 2000)
        memoryLimitMb:
          type: integer
          format: int64
          default: 1024
          description: Память хоста сверх занятой данными теста
        gpuMemoryLimitMb:
          type: integer
          format: int64
          description: Память GPU сверх буферов harness; не задан - вся GPU
    TimingSpec:
      type: object
      properties:
        mode:
          allOf: [{$ref: '#/components/schemas/TimingMode'}]
          description: Не задан - WALL; GPU_KERNELS нужно запросить явно
        warmupRuns: {type: integer, format: int32, default: 1, description: Вызовы без замера на первом тесте}
        maxRuns:
          type: integer
          format: int32
          default: 3
          description: Решает первый замер, если он не попал в серую зону (TL, 1.25 * TL]; иначе медиана
    TimingMode:
      type: string
      description: |
        WALL - от входа в solve до завершения всей запущенной им работы GPU;
        GPU_KERNELS - суммарное время ядер, запущенных solve (объединение интервалов)
      enum: [WALL, GPU_KERNELS]
    CompileSpec:
      type: object
      description: Для gpu-cuda (флаги - и для cuda-sim); незаданные поля берутся из настроек executor gpu-cuda
      properties:
        arch:
          type: string
          pattern: '^sm_[0-9]{2,3}$'
          description: Архитектура device-кода (без PTX); GPU executor'а gpu-cuda должна уметь его выполнять
        flags:
          type: array
          items: {type: string}
          description: Флаги nvcc вместо флагов по умолчанию; только разрешённые валидатором
    PolicyOverrides:
      type: object
      description: Поправки задачи к политике gpu-cuda
      properties:
        allowHeaders:
          type: array
          items: {type: string}
          description: Дополнительно разрешённые заголовки (точные имена или префиксы с / на конце)
        forbidHeaders:
          type: array
          items: {type: string}
        forbidSass:
          type: array
          items: {type: string}
          description: Запрещённые инструкции SASS, например HMMA, чтобы запретить тензорные ядра
        allowSass:
          type: array
          items: {type: string}
        allowInlineAsm: {type: boolean, description: Не задан - по умолчанию профиля}
    ValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid: {type: boolean}
        errors:
          type: array
          items: {type: string}
    ErrorResponse:
      type: object
      required: [error, details]
      properties:
        error: {type: string, description: Машиночитаемый код ошибки}
        details:
          type: array
          items: {type: string}
    ExecutorView:
      type: object
      required: [alive, lastSeen, heartbeat, healthyGpus]
      properties:
        alive: {type: boolean, description: Heartbeats приходят}
        lastSeen: {type: string, format: date-time}
        heartbeat: {$ref: '#/components/schemas/ExecutorHeartbeat'}
        healthyGpus: {type: integer, format: int32}
    ExecutorHeartbeat:
      type: object
      required: [executorId, hostname, processors, version, startedAt, timestamp, gpus, inFlight, capacity]
      properties:
        executorId: {type: string}
        hostname: {type: string}
        processors:
          type: array
          items: {$ref: '#/components/schemas/ProcessorStatus'}
          description: Процессоры, которые судит executor, каждый из своей очереди
        version: {type: string}
        startedAt: {type: string, format: date-time}
        timestamp: {type: string, format: date-time}
        gpus:
          type: array
          items: {$ref: '#/components/schemas/GpuSlotStatus'}
          description: Пусто у executor без GPU
        inFlight: {type: integer, format: int32, description: Взятые из очереди и ещё не завершённые задания}
        capacity: {type: integer, format: int32, description: Сколько заданий executor берёт из очереди сразу}
    ProcessorStatus:
      type: object
      required: [id, version, model, healthy, busy, capacity]
      properties:
        id: {type: string}
        version: {type: string, description: 'Версии тулчейна и эмулятора, для диагностики'}
        model: {type: string, description: 'Что показать человеку, например NVIDIA GeForce RTX 3060'}
        healthy: {type: boolean, description: 'Может взять задание (у gpu-cuda - есть исправная GPU)'}
        busy: {type: boolean, description: Все работники процессора заняты}
        capacity: {type: integer, format: int32, description: Сколько заданий процессора executor берёт сразу}
    ProcessorRun:
      type: object
      required: [id, version, model, executorId]
      properties:
        id: {type: string}
        version: {type: string}
        model: {type: string}
        executorId: {type: string}
        executorVersion: {type: string, nullable: true, description: Версия исполнителя из heartbeat на момент проверки.}
    GpuInfo:
      type: object
      required: [profile, name, index, executorId]
      properties:
        profile: {type: string}
        name: {type: string}
        index: {type: integer, format: int32}
        executorId: {type: string}
        maxTemperatureC: {type: integer, format: int32, nullable: true}
        minSmClockMhz: {type: integer, format: int32, nullable: true}
        maxSmClockMhz: {type: integer, format: int32, nullable: true}
        throttled: {type: boolean, nullable: true}
        clocksLocked: {type: boolean, nullable: true, description: Частоты были закреплены во время замера.}
    GpuSlotStatus:
      type: object
      required: [index, name, healthy, busy, clocksLocked]
      properties:
        index: {type: integer, format: int32}
        name: {type: string}
        healthy: {type: boolean}
        busy: {type: boolean}
        submissionId: {type: string}
        clocksLocked: {type: boolean}
    QueueView:
      type: object
      required: [processor, queue, aliveExecutors, healthyGpus, inFlight, capacity]
      properties:
        processor: {type: string}
        queue: {type: string}
        waiting:
          type: integer
          format: int64
          description: Задания в брокере, ещё не взятые executor; нет, если брокер не ответил
        consumers: {type: integer, format: int32, description: 'Нет, если брокер не ответил'}
        aliveExecutors: {type: integer, format: int32}
        healthyGpus: {type: integer, format: int32}
        inFlight: {type: integer, format: int32, description: 'Задания живых executors этого процессора, по всем их процессорам'}
        capacity: {type: integer, format: int32, description: Сколько заданий этого процессора живые executors берут сразу}
    ProcessorView:
      type: object
      required: [id, title, scoreType, languages, emulated, accepted, available]
      properties:
        id: {type: string}
        title: {type: string}
        scoreType: {$ref: '#/components/schemas/ScoreType'}
        languages:
          type: array
          items: {$ref: '#/components/schemas/LanguageInfo'}
        emulated: {type: boolean, description: 'false только у gpu-cuda'}
        accepted: {type: boolean, description: Gateway принимает посылки на этот процессор}
        available: {type: boolean, description: Есть живой executor с исправным процессором}
        model: {type: string, description: 'Модель от живого executor; нет, если таких нет'}
    ScoreType:
      type: string
      description: |
        TIME_MS - время на реальной GPU, мс; CYCLES - такты симулятора; CYCLES_X_DEPTH_X_TRANSISTORS - такты × глубина логики × транзисторы схемы;
        WEIGHTED_INSTRUCTIONS - инструкции плюс взвешенные промахи кэша
      enum: [TIME_MS, CYCLES, CYCLES_X_DEPTH_X_TRANSISTORS, WEIGHTED_INSTRUCTIONS]
    LanguageInfo:
      type: object
      required: [id, title, extension]
      properties:
        id: {type: string}
        title: {type: string}
        extension: {type: string, description: 'Расширение файла с точкой, например .cu'}
