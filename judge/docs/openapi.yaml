openapi: 3.0.3
info:
  title: GPU Codeforces Judge Gateway API
  version: 1.0.0
  description: |
    Точка входа системы проверки. Бэкенд отправляет сюда посылки, а прогресс и вердикты получает
    асинхронно из очереди RabbitMQ `judge.events` (сообщения `JudgeEvent` в JSON, см. judge/README.md).
    Все тела запросов и ответов - application/json, время в UTC (ISO 8601).
    Тело больше лимита (8 МБ по умолчанию) отклоняется с 413 до разбора, запрос с телом без
    Content-Length - с 411.
    Схемы, совпадающие с сообщениями брокера (`ProblemSpec`, `SubmissionRequest` и вложенные), заданы
    классами модуля judge-api; генератор использует их вместо своих моделей.
servers:
  - url: /api/v1
tags:
  - name: Submissions
  - name: Problems
  - name: Monitoring
paths:
  /submissions:
    post:
      tags: [Submissions]
      operationId: submit
      summary: Поставить посылку в очередь на проверку
      description: |
        Валидирует запрос и сохраняет задание в брокере (publisher confirm), сразу отвечает 202.
        Повтор того же submissionId в окне дедупликации возвращает 200 с duplicate=true и jobId
        первого запроса; 409, пока первый запрос ещё ждёт подтверждения брокера.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SubmissionRequest'}
      responses:
        '202':
          description: Принято, задание в очереди
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionAccepted'}
        '200':
          description: Повтор уже принятого submissionId; задание не ставится повторно
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SubmissionAccepted'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409':
          description: Этот же submissionId прямо сейчас принимается другим запросом, повторите позже
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '411': {$ref: '#/components/responses/LengthRequired'}
        '413': {$ref: '#/components/responses/TooLarge'}
        '503': {$ref: '#/components/responses/BrokerUnavailable'}
  /submissions/{submissionId}:
    delete:
      tags: [Submissions]
      operationId: cancel
      summary: Отменить посылку в очереди или в работе (без гарантий)
      description: |
        Если executor успел поймать отмену, следом придёт FINISHED с вердиктом CANCELLED.
        Сообщение об отмене не сохраняется, поэтому 202 не означает, что отмена сработает.
      parameters:
        - name: submissionId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/Id'}
      responses:
        '202': {description: Отмена разослана executors}
        '400': {$ref: '#/components/responses/BadRequest'}
        '503': {$ref: '#/components/responses/BrokerUnavailable'}
  /problems/validate:
    post:
      tags: [Problems]
      operationId: validateProblem
      summary: Структурно проверить задачу (тесты не генерируются)
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProblemSpec'}
      responses:
        '200':
          description: Результат проверки; ошибки задачи - не ошибка запроса
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '411': {$ref: '#/components/responses/LengthRequired'}
        '413': {$ref: '#/components/responses/TooLarge'}
  /executors:
    get:
      tags: [Monitoring]
      operationId: listExecutors
      summary: Executors и их последний heartbeat
      responses:
        '200':
          description: Executors по executorId
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ExecutorView'}
  /queues:
    get:
      tags: [Monitoring]
      operationId: listQueues
      summary: Ожидающие задания и доступная мощность по GPU-профилям
      responses:
        '200':
          description: Настроенные профили и профили, о которых сообщают executors
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/QueueView'}
components:
  responses:
    BadRequest:
      description: |
        Невалидный запрос: error=validation_failed (details - найденные ошибки)
        или malformed_request (тело не разбирается, details называет поле)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    LengthRequired:
      description: Нет Content-Length (error=length_required)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    TooLarge:
      description: Тело больше лимита (error=request_too_large)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
    BrokerUnavailable:
      description: Брокер недоступен (error=broker_unavailable), запрос можно повторить
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    Id:
      type: string
      pattern: '^[A-Za-z0-9._-]{1,128}$'
      description: Id посылки или задачи; попадает в имена файлов, сообщения и логи
    SubmissionRequest:
      type: object
      required: [submissionId, problem, source]
      properties:
        submissionId:
          allOf: [{$ref: '#/components/schemas/Id'}]
          description: Генерирует бэкенд; ключ идемпотентности
        problem: {$ref: '#/components/schemas/ProblemSpec'}
        source: {type: string, description: 'Содержимое .cu файла участника, до 128 КБ'}
        gpuProfile:
          type: string
          pattern: '^[a-z0-9_-]+$'
          description: GPU-профиль для проверки, например rtx3060; по умолчанию - профиль gateway
    SubmissionAccepted:
      type: object
      required: [submissionId, gpuProfile, status, queuedAt, duplicate, jobId]
      properties:
        submissionId: {type: string}
        gpuProfile: {type: string}
        status: {$ref: '#/components/schemas/SubmissionStatus'}
        queuedAt: {type: string, format: date-time}
        duplicate: {type: boolean, description: 'Этот submissionId уже был принят недавно и повторно не поставлен'}
        jobId: {type: string, description: 'Id задания; его же несут события JudgeEvent.jobId'}
    SubmissionStatus:
      type: string
      enum: [QUEUED, COMPILING, PREPARING, TESTING, FINISHED]
    ProblemSpec:
      type: object
      description: |
        Всё, что нужно judge о задаче; приходит целиком с каждой посылкой. Тестов в ней нет:
        их объявляет генератор (см. judge/docs/problem-format.md).
      required: [id, signature, generator]
      properties:
        id: {$ref: '#/components/schemas/Id'}
        version:
          type: string
          maxLength: 128
          default: '1'
          description: Версия на стороне бэкенда, только для логов; кэш ключуется хэшем содержимого
        signature: {$ref: '#/components/schemas/Signature'}
        generator: {$ref: '#/components/schemas/GeneratorSpec'}
        checker: {$ref: '#/components/schemas/CheckerSpec'}
        limits: {$ref: '#/components/schemas/LimitsSpec'}
        timing: {$ref: '#/components/schemas/TimingSpec'}
        compile: {$ref: '#/components/schemas/CompileSpec'}
        policy: {$ref: '#/components/schemas/PolicyOverrides'}
    Signature:
      type: object
      description: Сигнатура функции, которую реализует участник
      required: [params]
      properties:
        function: {type: string, default: solve}
        params:
          type: array
          items: {$ref: '#/components/schemas/ParamSpec'}
    ParamSpec:
      type: object
      required: [name, type, role]
      properties:
        name: {type: string, description: 'Идентификатор C; ключ в словарях генератора и эталона'}
        type: {$ref: '#/components/schemas/DType'}
        role: {$ref: '#/components/schemas/ParamRole'}
        memory:
          allOf: [{$ref: '#/components/schemas/MemorySpace'}]
          description: Где harness размещает массив перед вызовом solve; обязательно для массивов
        size:
          type: string
          description: 'Число элементов массива - целое выражение над скалярами, например M*K'
    ParamRole:
      type: string
      description: |
        INPUT - const T*, только чтение; OUTPUT - T*, сравнивается с эталоном;
        INOUT - T*, заполнен данными и сравнивается после изменения; SCALAR - передаётся по значению
      enum: [INPUT, OUTPUT, INOUT, SCALAR]
    MemorySpace:
      type: string
      enum: [DEVICE, HOST]
    DType:
      type: string
      description: Скаляры допускают только FLOAT32, FLOAT64, INT32, UINT32, INT64, UINT64
      enum: [FLOAT16, BFLOAT16, FLOAT32, FLOAT64, INT8, UINT8, INT16, INT32, UINT32, INT64, UINT64]
    GeneratorSpec:
      type: object
      required: [source]
      properties:
        language:
          allOf: [{$ref: '#/components/schemas/GeneratorLanguage'}]
          default: PYTHON
        source:
          type: string
          description: 'Python-модуль с tests(), generate(...) и reference(...), до 256 КБ'
    GeneratorLanguage:
      type: string
      enum: [PYTHON]
    CheckerSpec:
      type: object
      properties:
        mode:
          allOf: [{$ref: '#/components/schemas/CheckerMode'}]
          default: TOLERANCE
        rtol: {type: number, format: double, default: 0.00001}
        atol: {type: number, format: double, default: 0.000001}
    CheckerMode:
      type: string
      description: |
        TOLERANCE - для float |out - exp| <= atol + rtol * |exp|, NaN совпадает только с NaN,
        Inf - точно; целые сравниваются точно. EXACT - побитовое равенство
      enum: [TOLERANCE, EXACT]
    LimitsSpec:
      type: object
      properties:
        timeLimitMs:
          type: integer
          format: int64
          default: 1000
          description: 'Лимит измеренного времени одного вызова solve (см. TimingSpec.mode), до 30000'
        wallTimeLimitMs:
          type: integer
          format: int64
          description: Защитный лимит реального времени вызова; по умолчанию max(3 * TL, TL + 2000)
        memoryLimitMb:
          type: integer
          format: int64
          default: 1024
          description: Память хоста сверх занятой данными теста
        gpuMemoryLimitMb:
          type: integer
          format: int64
          description: Память GPU сверх буферов harness; не задан - вся GPU
    TimingSpec:
      type: object
      properties:
        mode:
          allOf: [{$ref: '#/components/schemas/TimingMode'}]
          description: Не задан - WALL; GPU_KERNELS нужно запросить явно
        warmupRuns: {type: integer, format: int32, default: 1, description: Вызовы без замера на первом тесте}
        maxRuns:
          type: integer
          format: int32
          default: 3
          description: Решает первый замер, если он не попал в серую зону (TL, 1.25 * TL]; иначе медиана
    TimingMode:
      type: string
      description: |
        WALL - от входа в solve до завершения всей запущенной им работы GPU;
        GPU_KERNELS - суммарное время ядер, запущенных solve (объединение интервалов)
      enum: [WALL, GPU_KERNELS]
    CompileSpec:
      type: object
      description: Незаданные поля берутся из настроек executor для его GPU-профиля
      properties:
        arch:
          type: string
          pattern: '^sm_[0-9]{2,3}$'
          description: Архитектура device-кода (без PTX); GPU профиля должна уметь его выполнять
        flags:
          type: array
          items: {type: string}
          description: Флаги nvcc вместо флагов по умолчанию; только разрешённые валидатором
    PolicyOverrides:
      type: object
      description: Поправки задачи к политике GPU-профиля
      properties:
        allowHeaders:
          type: array
          items: {type: string}
          description: Дополнительно разрешённые заголовки (точные имена или префиксы с / на конце)
        forbidHeaders:
          type: array
          items: {type: string}
        forbidSass:
          type: array
          items: {type: string}
          description: Запрещённые инструкции SASS, например HMMA, чтобы запретить тензорные ядра
        allowSass:
          type: array
          items: {type: string}
        allowInlineAsm: {type: boolean, description: Не задан - по умолчанию профиля}
    ValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid: {type: boolean}
        errors:
          type: array
          items: {type: string}
    ErrorResponse:
      type: object
      required: [error, details]
      properties:
        error: {type: string, description: Машиночитаемый код ошибки}
        details:
          type: array
          items: {type: string}
    ExecutorView:
      type: object
      required: [alive, lastSeen, heartbeat, healthyGpus]
      properties:
        alive: {type: boolean, description: Heartbeats приходят}
        lastSeen: {type: string, format: date-time}
        heartbeat: {$ref: '#/components/schemas/ExecutorHeartbeat'}
        healthyGpus: {type: integer, format: int32}
    ExecutorHeartbeat:
      type: object
      required: [executorId, hostname, gpuProfile, version, startedAt, timestamp, gpus, inFlight, capacity]
      properties:
        executorId: {type: string}
        hostname: {type: string}
        gpuProfile: {type: string}
        version: {type: string}
        startedAt: {type: string, format: date-time}
        timestamp: {type: string, format: date-time}
        gpus:
          type: array
          items: {$ref: '#/components/schemas/GpuSlotStatus'}
        inFlight: {type: integer, format: int32, description: Взятые из очереди и ещё не завершённые задания}
        capacity: {type: integer, format: int32, description: Сколько заданий executor берёт из очереди сразу}
    GpuSlotStatus:
      type: object
      required: [index, name, healthy, busy, clocksLocked]
      properties:
        index: {type: integer, format: int32}
        name: {type: string}
        healthy: {type: boolean}
        busy: {type: boolean}
        submissionId: {type: string}
        clocksLocked: {type: boolean}
    QueueView:
      type: object
      required: [gpuProfile, queue, aliveExecutors, healthyGpus, inFlight, capacity]
      properties:
        gpuProfile: {type: string}
        queue: {type: string}
        waiting:
          type: integer
          format: int64
          description: Задания в брокере, ещё не взятые executor; нет, если брокер не ответил
        consumers: {type: integer, format: int32, description: 'Нет, если брокер не ответил'}
        aliveExecutors: {type: integer, format: int32}
        healthyGpus: {type: integer, format: int32}
        inFlight: {type: integer, format: int32}
        capacity: {type: integer, format: int32}
